# Production backend stack for a single VPS (Contabo).
#
# The frontend is NOT here — it is a static build on Cloudflare Pages. This
# file runs: Traefik, the API (any number of replicas), Postgres, Redis, and a
# daily Postgres backup to S3-compatible storage.
#
# Two ways to put the API on the internet — pick one:
#
#   A) Cloudflare Tunnel (recommended). No inbound ports at all; the VPS
#      firewall can close 80/443 entirely.
#        docker compose --profile tunnel up -d
#      In the Cloudflare dashboard, route the public hostname api.$DOMAIN to
#      http://traefik:80. Keep CLIENT_IP_SOURCE=cloudflare.
#
#   B) Direct DNS (A record -> VPS IP, DNS-only / grey cloud). Traefik
#      terminates TLS with Let's Encrypt:
#        docker compose -f compose.yml -f compose.direct.yml up -d
#
# Scale the API (Traefik load-balances every replica automatically):
#   API_REPLICAS=3 docker compose --profile tunnel up -d
#
# Zero-downtime updates. `docker compose up` replaces containers stop-first,
# so use the docker-rollout plugin (github.com/wowu/docker-rollout), which
# starts new replicas, waits for their health check, then drains the old:
#   docker compose pull api && docker rollout api
# Under Swarm (`docker stack deploy`) the api's update_config does the same.
#
# Migrations run from the api image, never at boot:
#   docker compose run --rm api migrate
#   docker compose run --rm api seed          # first deploy only (taxonomy)
#
# Required .env next to this file (compose loads it automatically):
#   DOMAIN=example.com              # frontend at DOMAIN, API at api.DOMAIN
#   API_IMAGE=ghcr.io/<owner>/<repo>-api
#   API_TAG=latest                  # or a sha-XXXXXXX tag to pin a release
#   POSTGRES_PASSWORD=<strong>
#   BETTER_AUTH_SECRET=<32+ chars>
#   ACHIEVE_SHARED_SECRET=<32+ chars>
#   ATTESTATION_SECRET=<16+ chars>
#   ACHIEVE_ALLOWED_IPS=<comma-separated Achieve backend IPs>
#   S3_ENDPOINT= / S3_REGION= / S3_ACCESS_KEY_ID= / S3_SECRET_ACCESS_KEY= /
#   S3_BUCKET_NAME= / S3_PUBLIC_URL=           # media uploads
#   BACKUP_S3_ENDPOINT= / BACKUP_S3_REGION= / BACKUP_S3_ACCESS_KEY_ID= /
#   BACKUP_S3_SECRET_ACCESS_KEY= / BACKUP_S3_BUCKET=
#   BACKUP_PASSPHRASE=<strong>      # GPG-encrypts every dump
#   TUNNEL_TOKEN=<from Cloudflare>  # tunnel mode only
#   ACME_EMAIL=ops@example.com      # direct mode only

name: achieve-doubts

services:
  traefik:
    image: traefik:v3.7
    restart: unless-stopped
    # Plain HTTP on an internal-only entrypoint. In tunnel mode Cloudflare
    # terminates TLS and cloudflared connects to traefik:80 over the edge
    # network. compose.direct.yml replaces this with public 80/443 + ACME.
    command:
      - --providers.docker=true
      # Nothing is routable unless it opts in with traefik.enable=true.
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --accesslog=true
      - --log.level=INFO
    volumes:
      # Read-only: Traefik only needs to *watch* container labels. A writable
      # docker socket in a network-facing container is a root-equivalent hole.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [edge]
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 256M }

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: [tunnel]
    command: tunnel --no-autoupdate run
    env_file:
      - tunnel.env
    depends_on: [traefik]
    networks: [edge]
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 128M }

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    # Docker's default /dev/shm is 64MB, which makes parallel query plans fail
    # with "could not resize shared memory segment". The admin analytics
    # aggregations generate exactly those plans.
    shm_size: 1gb
    env_file:
      - pg.env
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=5GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=512MB
      # Each api replica pools 10 connections; 3 replicas + migrations +
      # backups + psql still fit comfortably.
      - -c
      - max_connections=60
      # NVMe: random reads cost essentially the same as sequential ones.
      - -c
      - random_page_cost=1.1
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U achieve -d achieve_doubts"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # No `ports:` — deliberately unreachable from outside the host.
    networks: [internal]
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 3584M }

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Everything stored here is ephemeral: rate-limit counters and in-flight
    # feed events. Losing it on restart costs one rate-limit window and a few
    # missed live updates, so persistence is off entirely. The memory cap plus
    # LRU eviction means a traffic spike evicts old counters instead of
    # pushing the box toward OOM.
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [internal]
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 320M }

  api:
    # Built and pushed by .github/workflows/api-image.yml; the VPS only pulls.
    #   docker compose pull api && docker compose up -d api
    image: ${API_IMAGE}:${API_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Required for multi-replica: shared rate-limit counters and cross-
      # instance WebSocket fan-out. Omit it and each replica silently gets its
      # own counters and its own isolated feed.
      REDIS_URL: redis://redis:6379
    env_file:
      - api.env
      - pg.env
      - s3.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Mapping form (not a list) so compose.direct.yml can override single keys.
    labels:
      traefik.enable: "true"
      traefik.docker.network: achieve-doubts_edge
      traefik.http.routers.api.rule: Host(`api.${DOMAIN}`)
      traefik.http.routers.api.entrypoints: web
      traefik.http.services.api.loadbalancer.server.port: "3000"
      # Drop a replica from rotation while it is unhealthy or restarting.
      # A draining replica answers 503 here. interval + timeout (15s) must stay
      # below SHUTDOWN_DRAIN_MS, or Traefik could still route to a replica that
      # has stopped accepting connections.
      traefik.http.services.api.loadbalancer.healthcheck.path: /api/healthz
      traefik.http.services.api.loadbalancer.healthcheck.interval: 10s
      traefik.http.services.api.loadbalancer.healthcheck.timeout: 5s
      traefik.http.routers.api.middlewares: api-compress@docker
      traefik.http.middlewares.api-compress.compress: "true"
    networks: [edge, internal]
    # Repeated from the Dockerfile on purpose: images built in OCI format
    # (Podman's default) drop HEALTHCHECK, and rolling updates depend on it.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    # SIGTERM -> drain (SHUTDOWN_DRAIN_MS, 15s) -> finish in-flight requests
    # (SHUTDOWN_TIMEOUT_MS, 10s) -> exit. Must exceed that 25s, or the replica
    # is SIGKILLed mid-request.
    stop_grace_period: 35s
    deploy:
      mode: replicated
      replicas: ${API_REPLICAS:-2}
      # update_config and rollback_config are honoured by `docker stack deploy`
      # (Swarm) only. Plain `docker compose up` ignores them and replaces
      # containers stop-first — use `docker rollout api` there instead.
      update_config:
        # One replica at a time, new one healthy BEFORE the old one stops.
        parallelism: 1
        order: start-first
        delay: 10s
        # Watch each new replica this long before moving on; any failure in
        # that window reverts the whole update.
        monitor: 30s
        failure_action: rollback
        max_failure_ratio: 0
      rollback_config:
        parallelism: 1
        order: start-first
        delay: 5s
        monitor: 30s
        failure_action: pause
      restart_policy:
        condition: any
        delay: 5s
        window: 60s
      resources:
        # Sized so three replicas fit alongside Postgres (3.5G), Redis,
        # Traefik and the backup job on an 8 GB box.
        limits: { cpus: "2.0", memory: 1024M }
        reservations: { memory: 256M }

  backup:
    # https://github.com/solectrus/postgres-s3-backup — the tag must match the
    # Postgres major version above, since it picks the pg_dump version.
    image: ghcr.io/solectrus/postgres-s3-backup:17
    restart: unless-stopped
    environment:
      # Daily at 00:00 UTC.
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: "14"
      # GPG-encrypts every dump before upload. Store this somewhere other than
      # the VPS — without it the backups cannot be restored.
      POSTGRES_HOST: postgres
      # Separate credentials (and ideally a separate bucket) from media
      # uploads: the API's key should not be able to delete backups.
      S3_PREFIX: postgres
    env_file:
      - pg.env
      - s3.env
      - backup.env
    depends_on:
      postgres:
        condition: service_healthy
    # `internal` has no route to the internet, so the job also needs `egress`
    # to reach the bucket.
    networks: [internal, egress]
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 512M }

networks:
  # Traefik, cloudflared and the api. Has outbound internet access.
  edge:
  # Postgres, Redis and their clients. No route to or from the internet.
  internal:
    internal: true
  # Outbound-only access for the backup job; nothing listens on it.
  egress:

volumes:
  pgdata:
